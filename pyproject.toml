[project]
name = "courseware-api"
version = "0.1.0"
description = "Courseware catalog, authentication and versioned publishing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "argon2-cffi>=23.1", "jsonschema>=4.23,<5", "pillow>=11,<13",
  "psutil>=7,<8",
]

[project.scripts]
courseware = "courseware.cli:main"
courseware-api = "courseware.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/courseware"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "courseware/migrations"

[tool.hatch.build.targets.sdist]
include = ["src/courseware", "migrations", "pyproject.toml", "README.md", "LICENSE", "uv.lock"]

[[tool.uv.index]]
name = "funpy"
url = "https://farfarfun-cn-hangzhou.devops.aliyuncs.com/packages/api/protocol/pypi/funpy/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
